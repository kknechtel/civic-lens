# /etc/nginx/sites-available/longbeach — longbeach.ahnj.info
# The API is served directly (no Next.js hop) so chat streams aren't buffered.
server {
    listen 80;
    server_name longbeach.ahnj.info;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://127.0.0.1:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # server-sent events (chat)
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Not for search engines: this is a private site.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
