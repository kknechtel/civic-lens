# New Jersey — state rules, records law, and integrity thresholds inherited by every NJ town.
name: State of New Jersey
short_name: New Jersey
level: state
code: NJ
government_type: state
ocd_id: ocd-division/country:us/state:nj
crawl:
  respect_robots: false
entities:
- key: nj
  label: State of New Jersey
  short: NJ
  kind: state
  description: State of New Jersey agencies (DCA/DLGS, DOE, Comptroller, courts)
  legacy_keys:
  - state
records_law:
  name: Open Public Records Act
  short: OPRA
  citation: N.J.S.A. 47:1A-1 et seq.
  respond_business_days: 7
  notes: Custodian must grant or deny within 7 business days. Requests use the agency's (or the state model) OPRA
    form. Commercial requesters and Daniel's Law redactions have special rules after the 2024 amendments.
oversight:
- NJ Division of Local Government Services (DLGS) — user-friendly budgets, annual financial statements
- NJ Department of Education — school ACFRs, user-friendly budgets
ai_notes:
- NJ schools report on GAAP/GASB; NJ municipalities use the REGULATORY basis — they are NOT directly comparable.
- NJ school surplus is statutorily capped at the greater of 2% of expenditures or $250K (N.J.S.A. 18A:7F-7) — do
  NOT apply GFOA's 16% benchmark to schools.
- For FY26+, CMPTRA is fully consolidated into ETR for municipalities — expect $0 CMPTRA, not a decline.
- Municipal net debt cannot exceed 3.5% of equalized valuation (N.J.S.A. 40A:2-6) without Local Finance Board approval.
glossary:
  user friendly budget:
  - ufb
  - summary budget
  ufb:
  - user friendly budget
  anjec:
  - association of new jersey environmental commissions
  njdep:
  - nj department of environmental protection
  - department of environmental protection
  njdca:
  - nj department of community affairs
  - department of community affairs
  dlgs:
  - division of local government services
  lfb:
  - local finance board
  njdoe:
  - nj department of education
  - department of education
  opra:
  - open public records act
  - records request
# Thresholds and citations for the integrity rules (api/services/integrity/rules.py).
# Bid thresholds are adjusted every 5 years by the Division of Local Government
# Services — confirm against the current DLGS Local Finance Notice.
integrity:
  bid_threshold:
    # Units with a Qualified Purchasing Agent (most towns). Without a QPA the LPCL cap is $17,500.
    purchase: 53000
    public_works: 53000
    history:
    - {from: '2015-07-01', purchase: 40000, public_works: 40000}
    - {from: '2020-07-01', purchase: 44000, public_works: 44000}
    - {from: '2025-07-01', purchase: 53000, public_works: 53000}
    citation: N.J.S.A. 40A:11-3 — $53,000 with a QPA from July 1, 2025 (LFN 2025-08); $44,000 from 2020, $40,000 from 2015
  emergency:
    citation: N.J.S.A. 40A:11-6 and N.J.A.C. 5:34-6 — emergency contracts need a written certification and a report to the governing body at its next meeting
  near_threshold_ratio: 0.85
  split_window_days: 90
  concentration_months: 24
  concentration_min_awards: 3
  payout_review_amount: 25000
  change_order:
    cap_pct: 20
    citation: N.J.A.C. 5:30-11 — change orders cumulatively over 20% of the contract need additional approvals
  pay_to_play:
    statutory: true
    window_days: 365
    contribution_threshold: 300
    contract_threshold: 17500
    annual_disclosure_threshold: 50000  # N.J.S.A. 19:44A-20.27 — ELEC Form B-1
    citation: N.J.S.A. 19:44A-20.4 et seq. (local pay-to-play) — contributions over $300 in the prior year bar a non-fair-and-open contract over $17,500; local ordinances may be stricter
